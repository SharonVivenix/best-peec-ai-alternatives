# Self serve plans for Peec AI and the alternatives in this repo.
# solve.py reads this file to answer "which tool covers these engines at this
# prompt count, and what is the cheapest plan that does it". render_table.py
# builds both README tables from it. Never type a computed number by hand.
#
# Plan fields
#   price        monthly list price in `currency`, null when usage priced
#   prompts      tracked prompt cap, null when credits or configurable
#   included     engines every subscriber gets
#   choose/pool  pick `choose` engines from `pool` (Peec and AIclicks work this way)
#   addon        engines you can buy on top of the plan
#   addon_price  monthly price per add on engine, null when not published
#   addon_bundle monthly cap when all add ons are bought together
# Tool fields
#   enterprise   engines that exist only behind a sales contract
#   action       report | prioritize | execute, what the self serve plan does
#                with the data once it is collected
#   checked      where the plan facts came from and when
#
# Engine ids: chatgpt perplexity gemini aio ai_mode copilot claude grok
#             deepseek meta mistral qwen naver

- id: peec
  name: Peec AI
  url: https://peec.ai/pricing
  currency: USD
  action: prioritize
  api: Enterprise only
  trial: none listed
  checked: vendor pricing page, 30 October 2026
  plans:
    - {name: Starter, price: 95, prompts: 50, choose: 3,
       pool: [chatgpt, ai_mode, aio, copilot, gemini, perplexity, naver],
       addon: [chatgpt, ai_mode, aio, copilot, gemini, perplexity, naver], addon_price: null}
    - {name: Pro, price: 245, prompts: 150, choose: 3,
       pool: [chatgpt, ai_mode, aio, copilot, gemini, perplexity, naver],
       addon: [chatgpt, ai_mode, aio, copilot, gemini, perplexity, naver], addon_price: null}
    - {name: Advanced, price: 495, prompts: 350, choose: 3,
       pool: [chatgpt, ai_mode, aio, copilot, gemini, perplexity, naver],
       addon: [chatgpt, ai_mode, aio, copilot, gemini, perplexity, naver], addon_price: null}
  enterprise: [claude, grok, deepseek, qwen, mistral, meta]

